<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - CampusBuzz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <nav class="navbar">

            <div class="logo">
                CampusBuzz
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>

        </nav>
    </header>


    <!-- CONTACT -->
    <section class="contact-section">

        <div class="contact-container">

            <div class="contact-info">

                <h1>Contact Us</h1>

                <p>
                    Have a question about CampusBuzz?
                    Send us a message.
                </p>

                <div class="contact-details">

                    <p>📧 <strong>Email:</strong> campusbuzz@gmail.com</p>

                    <p>📞 <strong>Phone:</strong> +91 98765 43210</p>

                    <p>📍 <strong>Location:</strong> College Campus</p>

                </div>

            </div>


            <div class="contact-form">

                <h2>Send a Message</h2>

                <form id="contactForm">

                    <label for="contactName">Name</label>

                    <input
                        type="text"
                        id="contactName"
                        placeholder="Enter your name"
                        required
                    >


                    <label for="contactEmail">Email</label>

                    <input
                        type="email"
                        id="contactEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        rows="5"
                        placeholder="Write your message"
                        required
                    ></textarea>


                    <button type="submit" class="btn">
                        Send Message
                    </button>

                </form>

                <p id="contactMessage"></p>

            </div>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 CampusBuzz | College Event Management System
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
