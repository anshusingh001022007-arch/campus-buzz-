<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Registration - CampusBuzz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <nav class="navbar">

            <div class="logo">
                CampusBuzz
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>

        </nav>
    </header>


    <!-- REGISTRATION -->
    <section class="registration-section">

        <div class="registration-box">

            <h1>Event Registration</h1>

            <p>
                Fill in your details to register for an event.
            </p>

            <form id="registrationForm">

                <label for="studentName">Student Name</label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name"
                    required
                >


                <label for="rollNumber">Roll Number</label>

                <input
                    type="text"
                    id="rollNumber"
                    placeholder="Enter your roll number"
                    required
                >


                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="event">Select Event</label>

                <select id="event" required>

                    <option value="">
                        -- Select an Event --
                    </option>

                    <option value="Cultural Fest">
                        Cultural Fest
                    </option>

                    <option value="Tech Fest">
                        Tech Fest
                    </option>

                    <option value="Sports Day">
                        Sports Day
                    </option>

                    <option value="Art Competition">
                        Art Competition
                    </option>

                </select>


                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >


                <button type="submit" class="btn">
                    Submit Registration
                </button>

            </form>

            <p id="registrationMessage"></p>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 CampusBuzz | College Event Management System
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
